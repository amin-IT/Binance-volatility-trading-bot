# Binance Volatility Trading Bot configuration.
# Most trading_options are re-read while the bot runs: save this file and the bot
# picks up the change at its next price check. Settings marked (restart) need a restart.

script_options:
  # True: simulate trades with live prices, no orders are sent (no API keys needed).
  # False: trade with REAL money. Leave this True until you have tested your settings. (restart)
  TEST_MODE: True

  # With TEST_MODE: False, send the orders to the Binance Spot Testnet (test funds)
  # instead of your real account. Needs testnet keys in creds.yml. (restart)
  USE_TESTNET: False

  # Append every buy and sell to LOG_FILE.
  LOG_TRADES: True
  LOG_FILE: 'trades.txt'

  # Extra logging (same as starting the bot with --debug).
  DEBUG: False

  # Set to True if you use Binance.US (accounts in the United States). (restart)
  AMERICAN_USER: False


trading_options:
  # Quote asset to trade with: the bot trades <COIN><PAIR_WITH> pairs, e.g. BTCUSDT. (restart)
  PAIR_WITH: USDT

  # Amount of PAIR_WITH spent on each buy. Your balance must be at least MAX_COINS * QUANTITY.
  # Binance's minimum order is around 5-10 USDT; use 15 or more so a coin can still be sold
  # after its price drops.
  QUANTITY: 15

  # Maximum number of coins held at the same time.
  #  0: buy nothing, keep selling held coins at take profit / stop loss.
  # -1: buy nothing and stop the bot once every held coin is sold.
  MAX_COINS: 10

  # Coins and pairs that are never bought. Each entry is matched against the base asset
  # (e.g. USDC) and the full pair (e.g. EURUSDT). Fiat currencies and stablecoins are
  # excluded because they barely move.
  FIATS:
    - EURUSDT
    - GBPUSDT
    - JPYUSDT
    - USDUSDT
  EX_PAIRS: ['EUR', 'GBP', 'AUD', 'BRL', 'RUB', 'TRY', 'JPY', 'UAH', 'NGN', 'ARS', 'MXN', 'ZAR', 'PLN', 'RON', 'CZK',
             'BIDR', 'IDRT', 'BVND', 'USD', 'USDT', 'USDC', 'BUSD', 'TUSD', 'USDP', 'PAX', 'DAI', 'FDUSD', 'AEUR',
             'EURI', 'USD1', 'USDE', 'XUSD', 'VAI', 'SUSD', 'PAXG', 'WBTC', 'WBETH', 'BETH', 'BNSOL',
             'SUPER', 'NCASH', 'RENBTC']

  # Only trade the coins listed in TICKERS_LIST (one coin per line, e.g. BTC).
  # With CUSTOM_LIST: False every PAIR_WITH pair on Binance is watched.
  CUSTOM_LIST: True
  TICKERS_LIST: 'tickers.txt'

  # Window, in MINUTES, over which price rises are measured.
  TIME_DIFFERENCE: 1

  # Number of price checks per TIME_DIFFERENCE (minimum 1). Stop loss and take profit are
  # also checked this often: 1 minute / 6 = every 10 seconds.
  RECHECK_INTERVAL: 6

  # Buy a coin whose price is this many % above its lowest price of the last TIME_DIFFERENCE
  # minutes. A very high value (e.g. 90) effectively disables these buys, so the bot only
  # buys coins suggested by the signal modules.
  CHANGE_IN_PRICE: 90

  # Sell a coin once it is this many % below its buy price. Must be NEGATIVE.
  STOP_LOSS: -3

  # Sell (or, with the trailing stop loss, start trailing) a coin once it is this many %
  # above its buy price.
  TAKE_PROFIT: 1.0

  # Trailing stop loss: once TAKE_PROFIT is reached the coin is not sold right away;
  # instead the stop loss is moved to TRAILING_STOP_LOSS % below the price and follows the
  # price up (it never moves down), and the coin is sold when the price falls back to it.
  # Keep TRAILING_STOP_LOSS greater than TRAILING_TAKE_PROFIT.
  USE_TRAILING_STOP_LOSS: True
  TRAILING_STOP_LOSS: 0.2
  TRAILING_TAKE_PROFIT: 0.1

  # Trading fee in % per trade, used for the profit figures. 0.1 is the standard spot fee;
  # 0.075 if you pay fees with BNB (enable it on Binance and keep some BNB in your account).
  TRADING_FEE: 0.075

  # Liquidity filters, applied to every buy (signal modules included). 0 disables a filter.
  # Illiquid coins can jump several % on a single trade and market orders on them fill at
  # bad prices, so these protect against false signals and slippage.
  # Maximum bid/ask spread in %.
  MAX_SPREAD: 0.5
  # Minimum traded volume over the last 24 hours, in PAIR_WITH (e.g. USDT).
  MIN_24H_VOLUME: 1000000

  # Signal modules to run alongside the bot (see signal_modules/__init__.py). (restart)
  SIGNALLING_MODULES:
    - pausebotmod
    - VolScan
